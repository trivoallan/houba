[project]
name = "knock-oci"
version = "0.9.3"
description = "Stamp external OCI images with portable provenance through a hardening policy"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
knock = "knock.cli.main:_run"

[project.optional-dependencies]
scan = ["redis>=8"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "jsonschema>=4.26.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "redis>=8",
    "ruff>=0.5",
    "syrupy>=4.6",
    "types-pyyaml>=6.0",
]
docs = [
    "json-schema-for-humans>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knock"]

[tool.ruff]
line-length = 100
target-version = "py313"
# TODO: retirer cette exclusion une fois le legacy ci/ supprimé (Phase B/C, cf. spec §10).
#
# `*.md`: ruff >= 0.16 formats Python code blocks inside Markdown. The blocks in
# docs/superpowers/specs/ are illustrative — hand-aligned for reading, sometimes
# elided with `...`, sometimes pseudo-code — not source that runs. Reformatting them
# to a 100-column rule degrades the document to satisfy a tool that was never meant
# to judge it. Python files are unaffected; this only stops the formatter reaching
# into prose.
extend-exclude = ["ci", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # assert OK dans tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Operational demo glue (reference deployment): intentional subprocess + internal-HTTP calls.
"scripts/dt-bootstrap.py" = ["S"]
"scripts/extract_sbom.py" = ["S"]
"scripts/scan-enqueue.py" = ["S"]
"scripts/scan-reserve.py" = ["S"]
"scripts/scan-ack.py" = ["S"]
"scripts/scan-reaper.py" = ["S"]
"scripts/scan-dlq.py" = ["S"]
"scripts/scan-coverage.py" = ["S"]
"scripts/scan_streams.py" = ["S"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["knock"]

[[tool.mypy.overrides]]
module = ["knock.adapters.*", "knock.cli.*"]
disallow_untyped_calls = false  # plus laxiste sur les couches I/O

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["knock"]
omit = ["knock/cli/_di.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
